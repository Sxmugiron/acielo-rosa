<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nuevo pago | Acielo Rosa</title>

    <link
        rel="stylesheet"
        href="../estilos.css">
    <link rel="stylesheet" href="pagos-premium.css">

</head>

<body class="pagos-premium">



<nav>
    <div class="logo">Acielo Rosa</div>

    <div class="menu">
        <a href="../index.html">Inicio</a>
        <a href="../usuarios/index.html">Usuarios</a>
        <a href="../servicios/index.html">Servicios</a>
        <a href="../citas/index.html">Citas</a>
        <a href="index.html" class="activo">Pagos</a>
        <a href="../analisis/index.html">Análisis</a>
    </div>
</nav>



<main>


    <div class="page-head">

        <h2>
            Registrar pago
        </h2>

        <p class="subtitulo">
            Registra un pago asociado a una cita.
        </p>

    </div>


    <div class="card form-card">


        <form id="formPago">


            <div class="campo">

                <label for="idcita">
                    ID de la cita
                </label>

                <input
                    type="number"
                    id="idcita"
                    min="1"
                    required
                    placeholder="Ej: 1">

            </div>


            <div class="campo">

                <label for="valor">
                    Valor
                </label>

                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    required
                    placeholder="Valor del pago">

            </div>


            <div class="campo">

                <label for="estado">
                    Estado
                </label>

                <select
                    id="estado"
                    required>

                    <option value="pendiente">
                        Pendiente
                    </option>

                    <option value="pagado">
                        Pagado
                    </option>

                    <option value="rechazado">
                        Rechazado
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="fecha_hora">
                    Fecha y hora
                </label>

                <input
                    type="datetime-local"
                    id="fecha_hora">

            </div>


            <div class="campo">

                <label for="comprobante">
                    Comprobante
                </label>

                <input
                    type="text"
                    id="comprobante"
                    placeholder="Número o referencia del comprobante">

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-rosa">
                    Registrar pago
                </button>


                <a
                    href="index.html"
                    class="btn btn-gris">
                    Cancelar
                </a>

            </div>


        </form>


        <div
            id="mensaje"
            class="msg">
        </div>


    </div>

</main>


<script src="../api.js"></script>


<script>

const formulario =
    document.getElementById(
        "formPago"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const fechaInput =
            document.getElementById(
                "fecha_hora"
            ).value;


        const datos = {

            idcita:
                Number(
                    document.getElementById(
                        "idcita"
                    ).value
                ),

            valor:
                Number(
                    document.getElementById(
                        "valor"
                    ).value
                ),

            estado:
                document.getElementById(
                    "estado"
                ).value,

            fecha_hora:
                fechaInput
                    ? new Date(
                        fechaInput
                    ).toISOString()
                    : new Date().toISOString(),

            comprobante:
                document.getElementById(
                    "comprobante"
                ).value.trim()

        };


        try {

            await enviarDatos(
                API.pagos,
                "POST",
                datos
            );


            mensaje.className =
                "msg ok";

            mensaje.textContent =
                "Pago registrado correctamente.";


            formulario.reset();


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1200);


        } catch (error) {

            console.error(error);


            mensaje.className =
                "msg error";

            mensaje.textContent =
                "No se pudo registrar el pago: " +
                error.message;

        }

    }
);

</script>

</body>
</html>
