<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar usuario | Acielo Rosa</title>

    <link rel="stylesheet" href="../estilos.css">
    <link rel="stylesheet" href="usuarios-premium.css">
</head>

<body class="usuarios-premium">

<nav>
    <div class="logo">Acielo Rosa</div>

    <div class="menu">
        <a href="../index.html">Inicio</a>
        <a href="index.html" class="activo">Usuarios</a>
        <a href="../servicios/index.html">Servicios</a>
        <a href="../citas/index.html">Citas</a>
        <a href="../pagos/index.html">Pagos</a>
        <a href="../analisis/index.html">Análisis</a>
    </div>
</nav>

<main>

    <div class="page-head">
        <h2>Registrar usuario</h2>

        <p class="subtitulo">
            Crea un nuevo usuario para la plataforma.
        </p>
    </div>

    <div class="card form-card">

        <form id="formUsuario">

            <div class="campo">
                <label for="nombre">Nombre completo</label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre completo"
                    required>
            </div>


            <div class="campo">
                <label for="usuario">Usuario</label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Nombre de usuario"
                    required>
            </div>


            <div class="campo">
                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required>
            </div>


            <div class="campo">
                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required>
            </div>


            <div class="campo">
                <label for="telefono">Teléfono</label>

                <input
                    type="text"
                    id="telefono"
                    placeholder="Número de teléfono">
            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-rosa">
                    Registrar usuario
                </button>

                <a
                    href="index.html"
                    class="btn btn-gris">
                    Cancelar
                </a>

            </div>

        </form>


        <div id="mensaje" class="msg"></div>

    </div>

</main>


<script src="../api.js"></script>

<script>

const formulario =
    document.getElementById("formUsuario");

const mensaje =
    document.getElementById("mensaje");


formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    const datos = {

        nombre:
            document.getElementById("nombre").value.trim(),

        usuario:
            document.getElementById("usuario").value.trim(),

        email:
            document.getElementById("email").value.trim(),

        password:
            document.getElementById("password").value,

        telefono:
            document.getElementById("telefono").value.trim()

    };


    try {

        const respuesta =
            await enviarDatos(
                API.usuarios,
                "POST",
                datos
            );


        console.log(respuesta);


        mensaje.className = "msg ok";

        mensaje.textContent =
            "Usuario registrado correctamente.";


        formulario.reset();


        setTimeout(function() {

            window.location.href = "index.html";

        }, 1000);


    } catch (error) {

        console.error(error);

        mensaje.className = "msg error";

        mensaje.textContent =
            "No se pudo registrar el usuario: " +
            error.message;

    }

});

</script>

</body>
</html>
