<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Acielo Rosa</title>

    <link
        rel="stylesheet"
        href="../estilos.css">
    <link rel="stylesheet" href="usuarios-premium.css">

</head>


<body class="usuarios-premium">


<nav>

    <div class="logo">
        Acielo Rosa
    </div>


    <div class="menu">

        <a href="../index.html">
            Inicio
        </a>

        <a href="index.html">
            Usuarios
        </a>

        <a href="../servicios/index.html">
            Servicios
        </a>

        <a href="../citas/index.html">
            Citas
        </a>

        <a href="../pagos/index.html">
            Pagos
        </a>

        <a href="../analisis/index.html">Análisis</a>

    </div>

</nav>


<main>


    <div class="card form-card login-card">


        <div class="page-head">

            <h2>
                Iniciar sesión
            </h2>

            <p class="subtitulo">
                Accede a tu cuenta de Acielo Rosa.
            </p>

        </div>


        <form id="formLogin">


            <div class="campo">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="correo@ejemplo.com">

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    placeholder="Contraseña">

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-rosa">
                    Iniciar sesión
                </button>


                <a
                    href="insertar_usuario.html"
                    class="btn btn-gris">
                    Crear cuenta
                </a>

            </div>


        </form>


        <div
            id="mensaje"
            class="msg">
        </div>


    </div>


</main>


<script src="../api.js"></script>


<script>

const formulario =
    document.getElementById("formLogin");

const mensaje =
    document.getElementById("mensaje");


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const datos = {

            email:
                document.getElementById(
                    "email"
                ).value.trim(),

            password:
                document.getElementById(
                    "password"
                ).value

        };


        try {

            const respuesta =
                await enviarDatos(
                    `${API.usuarios}/login`,
                    "POST",
                    datos
                );


            if (respuesta.token) {

                localStorage.setItem(
                    "token",
                    respuesta.token
                );

            }


            if (respuesta.usuario) {

                localStorage.setItem(
                    "usuario",
                    JSON.stringify(
                        respuesta.usuario
                    )
                );

            }


            mensaje.className =
                "msg ok";

            mensaje.textContent =
                "Inicio de sesión correcto.";


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            mensaje.className =
                "msg error";

            mensaje.textContent =
                "Correo o contraseña incorrectos.";

        }

    }
);

</script>

</body>
</html>
