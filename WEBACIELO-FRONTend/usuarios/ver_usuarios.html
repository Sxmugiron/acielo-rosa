<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Acielo Rosa</title>
    <link rel="stylesheet" href="../estilos.css">
    <link rel="stylesheet" href="usuarios-premium.css">

    <style>
        .tabla-contenedor {
            margin-top: 35px;
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(70, 40, 60, .06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            text-align: left;
            padding: 16px;
            background: #f8e4ed;
            color: #8f4164;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f0e7eb;
            font-size: 14px;
        }

        .acciones {
            display: flex;
            gap: 8px;
        }

        .btn {
            border: none;
            padding: 8px 13px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
        }

        .editar {
            background: #e8edf8;
            color: #53688f;
        }

        .eliminar {
            background: #fde5e5;
            color: #a33b3b;
        }

        .mensaje {
            padding: 25px;
            text-align: center;
            color: #777078;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #c24b7c;
            font-weight: 700;
        }
    </style>
</head>

<body class="usuarios-premium usuarios-consulta">

<nav aria-label="Navegación principal">
    <div class="logo">Acielo Rosa</div>
    <div class="menu">
        <a href="../index.html">Inicio</a>
        <a href="index.html" class="activo">Usuarios</a>
        <a href="../servicios/index.html">Servicios</a>
        <a href="../citas/index.html">Citas</a>
        <a href="../pagos/index.html">Pagos</a>
        <a href="../analisis/index.html">Análisis</a>
    </div>
</nav>

<main>

    <div class="page-head">
        <span>USUARIOS</span>
        <h1>Usuarios registrados</h1>
        <p>Consulta y administra los usuarios del sistema.</p>
    </div>

    <div class="tabla-contenedor">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaUsuarios">
                <tr>
                    <td colspan="6" class="mensaje">
                        Cargando usuarios...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

    <a href="index.html" class="volver">
        ← Volver a Usuarios
    </a>

</main>

<footer>
    <p>Acielo Rosa · Sistema de gestión</p>
</footer>

<script>

const API = 'http://192.168.100.3:3001/api/usuarios';

async function cargarUsuarios() {

    const tabla = document.getElementById('tablaUsuarios');

    try {

        const respuesta = await fetch(API);

        if (!respuesta.ok) {
            throw new Error();
        }

        const usuarios = await respuesta.json();

        tabla.innerHTML = '';

        if (usuarios.length === 0) {

            tabla.innerHTML = `
                <tr>
                    <td colspan="6" class="mensaje">
                        No hay usuarios registrados.
                    </td>
                </tr>
            `;

            return;
        }

        usuarios.forEach(usuario => {

            tabla.innerHTML += `
                <tr>

                    <td>${usuario.id}</td>

                    <td>${usuario.nombre}</td>

                    <td>${usuario.email ?? usuario.correo ?? "-"}</td>

                    <td>${usuario.telefono || '-'}</td>

                    <td>${usuario.rol || '-'}</td>

                    <td>
                        <div class="acciones">

                            <a
                                class="btn editar"
                                href="editar_usuario.html?id=${usuario.id}">
                                Editar
                            </a>

                            <button
                                class="btn eliminar"
                                onclick="eliminarUsuario(${usuario.id})">
                                Eliminar
                            </button>

                        </div>
                    </td>

                </tr>
            `;

        });

    } catch (error) {

        tabla.innerHTML = `
            <tr>
                <td colspan="6" class="mensaje">
                    No se pudo conectar con el microservicio de Usuarios.
                </td>
            </tr>
        `;

    }

}


async function eliminarUsuario(id) {

    const confirmar = confirm(
        '¿Seguro que deseas eliminar este usuario?'
    );

    if (!confirmar) {
        return;
    }

    try {

        const respuesta = await fetch(`${API}/${id}`, {
            method: 'DELETE'
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(
                datos.mensaje || 'No se pudo eliminar el usuario'
            );
        }

        alert('Usuario eliminado correctamente');

        cargarUsuarios();

    } catch (error) {

        alert(error.message);

    }

}


cargarUsuarios();

</script>

</body>
</html>
