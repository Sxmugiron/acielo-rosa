<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios registrados | Acielo Rosa</title>
    <link rel="stylesheet" href="../estilos.css">
    <link rel="stylesheet" href="servicios-premium.css">

    <style>
        .tabla-contenedor {
            margin-top: 35px;
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(70, 40, 60, .06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            text-align: left;
            padding: 16px;
            background: #f8e4ed;
            color: #8f4164;
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f0e7eb;
            font-size: 14px;
        }

        .acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 8px 13px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
        }

        .editar {
            background: #e8edf8;
            color: #53688f;
        }

        .eliminar {
            background: #fde5e5;
            color: #a33b3b;
        }

        .disponibilidad {
            background: #e6f5ec;
            color: #347a53;
        }

        .mensaje {
            padding: 25px;
            text-align: center;
            color: #777078;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #c24b7c;
            font-weight: 700;
        }
    </style>
</head>

<body class="servicios-premium">


<nav>
    <div class="logo">Acielo Rosa</div>

    <div class="menu">
        <a href="../index.html">Inicio</a>
        <a href="../usuarios/index.html">Usuarios</a>
        <a href="index.html" class="activo">Servicios</a>
        <a href="../citas/index.html">Citas</a>
        <a href="../pagos/index.html">Pagos</a>
        <a href="../analisis/index.html">Análisis</a>
    </div>
</nav>


<main>

    <div class="page-head">

        <span>SERVICIOS</span>

        <h1>Servicios registrados</h1>

        <p>
            Consulta los servicios, precios y cupos disponibles.
        </p>

    </div>

    <div class="tabla-contenedor">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Cupo mensual</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody id="tablaServicios">

                <tr>
                    <td colspan="6" class="mensaje">
                        Cargando servicios...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <a href="index.html" class="volver">
        ← Volver a Servicios
    </a>

</main>

<footer>
    <p>Acielo Rosa · Sistema de gestión</p>
</footer>

<script>

const API = 'http://192.168.100.3:3002/api/servicios';

async function cargarServicios() {

    const tabla = document.getElementById('tablaServicios');

    try {

        const respuesta = await fetch(API);

        if (!respuesta.ok) {
            throw new Error();
        }

        const servicios = await respuesta.json();

        tabla.innerHTML = '';

        if (servicios.length === 0) {

            tabla.innerHTML = `
                <tr>
                    <td colspan="6" class="mensaje">
                        No hay servicios registrados.
                    </td>
                </tr>
            `;

            return;
        }

        servicios.forEach(servicio => {

            tabla.innerHTML += `

                <tr>

                    <td>${servicio.id}</td>

                    <td>${servicio.nombre}</td>

                    <td>${servicio.descripcion || '-'}</td>

                    <td>$${Number(servicio.precio).toLocaleString('es-CO')}</td>

                    <td>${servicio.cupo_mensual}</td>

                    <td>

                        <div class="acciones">

                            <a
                                class="btn editar"
                                href="editar_servicio.html?id=${servicio.id}">
                                Editar
                            </a>

                            <a
                                class="btn disponibilidad"
                                href="ver_servicios.html?id=${servicio.id}">
                                Disponibilidad
                            </a>

                            <button
                                class="btn eliminar"
                                onclick="eliminarServicio(${servicio.id})">
                                Eliminar
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        });

    } catch (error) {

        tabla.innerHTML = `

            <tr>

                <td colspan="6" class="mensaje">
                    No se pudo conectar con el microservicio de Servicios.
                </td>

            </tr>

        `;

    }

}


async function eliminarServicio(id) {

    const confirmar = confirm(
        '¿Seguro que deseas eliminar este servicio?'
    );

    if (!confirmar) {
        return;
    }

    try {

        const respuesta = await fetch(`${API}/${id}`, {
            method: 'DELETE'
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {

            throw new Error(
                datos.mensaje || 'No se pudo eliminar el servicio'
            );

        }

        alert('Servicio eliminado correctamente');

        cargarServicios();

    } catch (error) {

        alert(error.message);

    }

}


cargarServicios();

</script>

</body>
</html>
