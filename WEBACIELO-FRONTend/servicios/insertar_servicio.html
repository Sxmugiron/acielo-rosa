<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nuevo servicio | Acielo Rosa</title>

    <link
        rel="stylesheet"
        href="../estilos.css">
    <link rel="stylesheet" href="servicios-premium.css">

</head>

<body class="servicios-premium">



<nav>
    <div class="logo">Acielo Rosa</div>

    <div class="menu">
        <a href="../index.html">Inicio</a>
        <a href="../usuarios/index.html">Usuarios</a>
        <a href="index.html" class="activo">Servicios</a>
        <a href="../citas/index.html">Citas</a>
        <a href="../pagos/index.html">Pagos</a>
        <a href="../analisis/index.html">Análisis</a>
    </div>
</nav>



<main>


    <div class="page-head">

        <h2>
            Registrar servicio
        </h2>

        <p class="subtitulo">
            Agrega un nuevo servicio a la fundación.
        </p>

    </div>


    <div class="card form-card">

        <form id="formServicio">


            <div class="campo">

                <label for="nombre">
                    Nombre del servicio
                </label>

                <input
                    type="text"
                    id="nombre"
                    required
                    placeholder="Nombre del servicio">

            </div>


            <div class="campo">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    placeholder="Describe el servicio">
                </textarea>

            </div>


            <div class="campo">

                <label for="precio">
                    Precio
                </label>

                <input
                    type="number"
                    id="precio"
                    min="0"
                    step="0.01"
                    required
                    placeholder="0">

            </div>


            <div class="campo">

                <label for="cupo_mensual">
                    Cupo mensual
                </label>

                <input
                    type="number"
                    id="cupo_mensual"
                    min="1"
                    value="15"
                    required>

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-rosa">
                    Registrar servicio
                </button>

                <a
                    href="index.html"
                    class="btn btn-gris">
                    Cancelar
                </a>

            </div>


        </form>


        <div
            id="mensaje"
            class="msg">
        </div>

    </div>

</main>


<script src="../api.js"></script>


<script>

const formulario =
    document.getElementById("formServicio");

const mensaje =
    document.getElementById("mensaje");


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const datos = {

            nombre:
                document.getElementById(
                    "nombre"
                ).value.trim(),

            descripcion:
                document.getElementById(
                    "descripcion"
                ).value.trim(),

            precio:
                Number(
                    document.getElementById(
                        "precio"
                    ).value
                ),

            cupo_mensual:
                Number(
                    document.getElementById(
                        "cupo_mensual"
                    ).value
                )

        };


        try {

            await enviarDatos(
                API.servicios,
                "POST",
                datos
            );


            mensaje.className =
                "msg ok";

            mensaje.textContent =
                "Servicio registrado correctamente.";


            formulario.reset();


            document.getElementById(
                "cupo_mensual"
            ).value = 15;


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1200);


        } catch (error) {

            console.error(error);

            mensaje.className =
                "msg error";

            mensaje.textContent =
                "No se pudo registrar el servicio: " +
                error.message;

        }

    }
);

</script>

</body>
</html>
