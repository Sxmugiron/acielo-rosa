global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http
    bind *:80

    acl ruta_analisis path_beg /api/analisis
    acl ruta_usuarios path_beg /api/usuarios
    acl ruta_servicios path_beg /api/servicios
    acl ruta_citas path_beg /api/citas
    acl ruta_pagos path_beg /api/pagosv

    use_backend analisis_backend if ruta_analisis
    use_backend usuarios_backend if ruta_usuarios
    use_backend servicios_backend if ruta_servicios
    use_backend citas_backend if ruta_citas
    use_backend pagos_backend if ruta_pagos

    default_backend usuarios_backend

backend usuarios_backend
    balance roundrobin
    server usuarios1 acielo_usuarios:3001 check

backend servicios_backend
    balance roundrobin
    server servicios1 acielo_servicios:3002 check

backend citas_backend
    balance roundrobin
    server citas1 acielo_citas:3003 check

backend pagos_backend
    balance roundrobin
    server pagos1 acielo_pagos:3004 check


backend analisis_backend
    balance roundrobin
    server spark_api 192.168.100.3:3005 check
